[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "local-ai-kb"
version = "0.1.0"
description = "Local-first modular knowledge ingestion foundation"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Orcun" }]
dependencies = [
    "exchangelib>=5.4.2",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "mypy>=1.10",
  "ruff>=0.6",
  "types-pyyaml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/aikb"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aikb"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = "exchangelib.*"
ignore_missing_imports = true
