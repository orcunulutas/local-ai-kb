# Example configuration for the built-in local Exchange Notes pipeline.
application:
  state_database: ./var/state/aikb.db
  published_directory: ./published
  log_level: INFO

pipeline:
  source: exchange_notes
  processor: default
  enrichment: ollama
  renderer: markdown
  sink: qmd

# References only: passwords are stored by the selected provider, never here.
credentials:
  exchange-kb:
    provider: keyring
    service: local-ai-kb.exchange
    username: user@example.invalid

  # Explicit fallback for headless operation or tests:
  # exchange-kb-headless:
  #   provider: environment
  #   variable: AIKB_EXCHANGE_PASSWORD

sources:
  exchange_notes:
    endpoint: https://exchange.example.invalid/EWS/Exchange.asmx
    server: exchange.example.invalid
    email: user@example.invalid
    username: user@example.invalid
    credential: exchange-kb
    auth_type: NTLM # NTLM or Basic
    # ca_cert_path: /path/to/custom/ca.crt # Optional custom CA certificate path
    checkpoint_key: exchange-notes
    folder:
      root: tois
      path: KB

enrichments:
  ollama:
    base_url: http://127.0.0.1:11434
    model: example-model
    timeout_seconds: 30
    # If true, publish original content when Ollama is temporarily unavailable.
    optional: false

sinks:
  qmd:
    executable: qmd
    collection: local-ai-kb
